name: Update Zotero Translators

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-translators:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Download latest translators
        run: npm run download-translators
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet translators/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update Zotero translators'
          title: 'Update Zotero Translators'
          body: |
            This PR updates the bundled Zotero translators to the latest versions from the Zotero repository.
            
            Changes were automatically detected and committed by the GitHub Actions workflow.
          branch: update-translators
          delete-branch: true
          labels: dependencies, automated
